<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="630" height="500"></canvas>
<script src="avatardata.js"></script>
<script>
// ── itch.io cover (630×500, itch's recommended size) — STATIC, one frame ────
// House style (promo3/11): neon title + sign box, pixel skyline, REAL avatars
// from the game's own AvatarRenderer (avatardata.js), zap bolt with a real
// ZapModal preset amount, fireworks, scanlines + vignette.
// Copy: "your keys · your city" (approved). Export via window.__shot() → 2×
// nearest-neighbor PNG (1260×1000) for crisp pixels on itch.
const W = 630, H = 500;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const PINK='#ff71ce', TEAL='#5dcaa5', AMBER='#f0b040', PURP='#7b68ee', CREAM='#fff5e6', BG='#0a0014';
let seed = 630500;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

// ── cast: 4 real avatars (same index→name/color pairs as promo11) ──
const CAST = [
  { idx: 1,  name: 'miko',   col: PINK },
  { idx: 4,  name: 'pep',    col: TEAL },
  { idx: 6,  name: 'clover', col: AMBER },
  { idx: 10, name: 'luna',   col: PURP },
];
const CAST_X = [90, 240, 390, 540];
const AV_SCALE = 2;                 // 48×76 sprite → 96×152
const STREET_Y = 486;               // feet line
const players = CAST.map((c, i) => {
  const img = new Image(); img.src = window.AVATARS[c.idx];
  return { ...c, img, x: CAST_X[i] };
});
const chest = (p) => [p.x, STREET_Y - 76 * AV_SCALE * 0.55];

function neon(txt, x, y, size, color, glow=12, align='center') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
  ctx.shadowBlur = 0;
}
function signBox(x, y, w, h, color, a) {
  ctx.globalAlpha = a;
  ctx.shadowColor = color; ctx.shadowBlur = 18 * a;
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.strokeRect(x - w/2, y - h/2, w, h);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// static firework: radial pixel rays with fade + slight droop
function fwBurst(cx, cy, color, R, n=26) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.283 + rnd() * 0.22;
    for (const [f, al, sz] of [[0.5, 0.9, 3], [0.74, 0.55, 2], [0.96, 0.3, 2]]) {
      const r = R * f * (0.85 + rnd() * 0.3);
      ctx.globalAlpha = al;
      ctx.fillStyle = color;
      ctx.fillRect((cx + Math.cos(a) * r) | 0, (cy + Math.sin(a) * r + r * 0.1) | 0, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // stars
  for (let i = 0; i < 70; i++) {
    ctx.globalAlpha = 0.25 + rnd() * 0.6;
    ctx.fillStyle = CREAM;
    ctx.fillRect((rnd() * W) | 0, (rnd() * 270) | 0, rnd() < 0.2 ? 2 : 1, rnd() < 0.2 ? 2 : 1);
  }
  ctx.globalAlpha = 1;

  // fireworks behind the title
  fwBurst(72, 88, TEAL, 46);
  fwBurst(556, 96, PINK, 52);
  fwBurst(468, 34, PURP, 34, 18);
  fwBurst(140, 26, AMBER, 30, 18);

  // skyline (base under the street fill)
  let x = -8;
  while (x < W + 8) {
    const bw = 42 + rnd() * 58, bh = 70 + rnd() * 130;
    ctx.fillStyle = '#120726';
    ctx.fillRect(x, 440 - bh, bw, bh + 20);
    for (let wy = 10; wy < bh - 10; wy += 16) {
      for (let wx = 7; wx < bw - 9; wx += 13) {
        if (rnd() < 0.42) {
          ctx.globalAlpha = rnd() < 0.15 ? 0.85 : 0.35;
          ctx.fillStyle = [PINK, TEAL, AMBER, PURP, CREAM][(rnd() * 5) | 0];
          ctx.fillRect(x + wx, 440 - bh + wy, 5, 8);
        }
      }
    }
    ctx.globalAlpha = 1;
    x += bw + 4;
  }
  // sidewalk + road (promo11 street treatment)
  ctx.fillStyle = '#160a2e'; ctx.fillRect(0, 440, W, 60);
  ctx.fillStyle = '#1f1040'; ctx.fillRect(0, 440, W, 3);
  ctx.fillStyle = '#0d0520'; ctx.fillRect(0, H - 10, W, 10);

  // ── title neon ──
  neonTitle();
  function neonTitle() {
    neon('NOSTR',    W/2, 82,  74, PINK, 24);
    neon('DISTRICT', W/2, 156, 74, PINK, 24);
    signBox(W/2, 119, 428, 168, PINK, 0.9);
    neon('your keys · your city', W/2, 232, 21, CREAM, 8);
  }

  // ── avatars on the street ──
  for (const p of players) {
    const w = p.img.naturalWidth * AV_SCALE, h = p.img.naturalHeight * AV_SCALE;
    ctx.drawImage(p.img, p.x - w/2, STREET_Y - h, w, h);
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.col;
    ctx.fillText(p.name, p.x, STREET_Y - h - 11);
  }

  // ── zap bolt: miko → clover, frozen mid-strike (zapBolt.ts look) ──
  const [x1, y1] = chest(players[0]);
  const [x2, y2] = chest(players[2]);
  const n = 9, pts = [[x1, y1]];
  const lift = -46;
  for (let i = 1; i < n; i++) {
    const f = i / n;
    pts.push([x1 + (x2-x1)*f, y1 + (y2-y1)*f + Math.sin(Math.PI*f)*lift + (rnd()-0.5)*20]);
  }
  pts.push([x2, y2]);
  for (const [lw, col, al] of [[5, AMBER, 0.35], [2.5, '#ffe060', 1]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.shadowColor = AMBER; ctx.shadowBlur = 14;
    ctx.globalAlpha = al;
    ctx.beginPath();
    pts.forEach(([px, py], j) => j ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
    ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  // discharge sparkle at the receiver
  for (let i = 0; i < 14; i++) {
    const a = rnd() * 6.283, r = 4 + rnd() * 16;
    ctx.globalAlpha = 0.4 + rnd() * 0.6;
    ctx.fillStyle = i % 3 ? '#ffe060' : CREAM;
    ctx.fillRect((x2 + Math.cos(a)*r) | 0, (y2 + Math.sin(a)*r) | 0, 2, 2);
  }
  ctx.globalAlpha = 1;
  neon('⚡21', x2, y2 - 58, 20, AMBER, 10);

  // scanlines + vignette
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// export: { native, x2 } base64 PNGs (x2 = nearest-neighbor 1260×1000)
window.__shot = () => new Promise((resolve) => {
  const ready = () => players.every(p => p.img.complete && p.img.naturalWidth);
  const go = () => {
    draw();
    const up = document.createElement('canvas');
    up.width = W * 2; up.height = H * 2;
    const uc = up.getContext('2d');
    uc.imageSmoothingEnabled = false;
    uc.drawImage(cv, 0, 0, W * 2, H * 2);
    resolve({
      native: cv.toDataURL('image/png').split(',')[1],
      x2: up.toDataURL('image/png').split(',')[1],
    });
  };
  const wait = () => ready() ? go() : setTimeout(wait, 100);
  wait();
});
</script>
</body>
</html>
