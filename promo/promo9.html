<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script src="avatardata.js"></script>
<script>
// ── "MAKE YOURSELF" — player customization cut ───────────────────────────────
// Every avatar here was rendered by the game's own AvatarRenderer (room sprite)
// from real AvatarConfig values — this IS what these outfits look like in-game.
// Counts are the real union sizes in avatarStore.ts; 718,204,032 =
// 4 bodies × 18 hair × 28 tops × 17 bottoms × 26 hats × 31 accessories × 26 eyes.
//  0-3     title
//  3-10.5  hero slot-machine — 14 real outfits on the beat
// 10.5-16  the math (real catalog counts)
// 16-22.5  lineup — seven citizens pop in
// 22.5-26.5 color sweep — same fit, 8 colors
// 26.5-30  end card
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const PINK='#ff71ce', TEAL='#5dcaa5', AMBER='#f0b040', PURP='#7b68ee', CREAM='#fff5e6', BG='#0a0014';
let seed = 9;
const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

const stars = Array.from({ length: 70 }, () => ({ x:(rnd()*W)|0, y:(rnd()*H)|0, ph:rnd()*6.28, s:rnd()<0.2?2:1 }));
const AV = window.AVATARS.map(d => { const im = new Image(); im.src = d; return im; });
const SW = window.SWEEP.map(d => { const im = new Image(); im.src = d; return im; });

function neon(txt, x, y, size, color, glow=12, align='center') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
  ctx.shadowBlur = 0;
}
const type = (s, t0, t, cps=20) => s.slice(0, Math.max(0, Math.min(s.length, Math.floor((t-t0)*cps))));

function avatar(im, cx, bottomY, scale, alpha=1) {
  if (!im.complete || !im.naturalWidth) return;
  const w = im.naturalWidth*scale, h = im.naturalHeight*scale;
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, Math.round(cx-w/2), Math.round(bottomY-h), w, h);
  ctx.globalAlpha = 1;
}

// spotlight disc under the hero
function spotlight(cx, y, r, col, a) {
  const g = ctx.createRadialGradient(cx, y, 4, cx, y, r);
  g.addColorStop(0, col.replace(')', `,${a})`).replace('rgb','rgba'));
  g.addColorStop(1, col.replace(')', ',0)').replace('rgb','rgba'));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, y, r, r*0.28, 0, 0, 6.283); ctx.fill();
}

const sparks = [];
function sparkle(x, y, col, n=14) {
  for (let i = 0; i < n; i++) {
    const a = rnd()*6.283, s = 30+rnd()*90;
    sparks.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s-30, c: col, life: 0.35+rnd()*0.3, t: 0 });
  }
}

const SWAP_MS = 0.5, SWAP_T0 = 3.4, NSWAPS = 14;
const LINEUP = [1, 3, 5, 7, 8, 10, 13]; // varied picks for the row
let prev = 0, lastIdx = -1, lastSw = -1, lastPop = -1;

function draw(t) {
  const dt = Math.min(0.05, t - prev); prev = t;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = 0.15+0.3*(0.5+0.5*Math.sin(t*1.8+s.ph)); ctx.fillStyle = CREAM; ctx.fillRect(s.x,s.y,s.s,s.s); }
  ctx.globalAlpha = 1;

  for (let i = sparks.length-1; i >= 0; i--) {
    const p = sparks[i]; p.t += dt;
    if (p.t >= p.life) { sparks.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt;
    ctx.globalAlpha = 1-p.t/p.life; ctx.fillStyle = p.c;
    ctx.fillRect(p.x|0, p.y|0, 2, 2);
  }
  ctx.globalAlpha = 1;

  if (t < 3) {
    neon(type('MAKE YOURSELF', 0.3, t, 12), W/2, 210, 72, PINK, 24);
    if (t > 1.5) neon('every keypair gets a body', W/2, 290, 26, CREAM, 8);
  } else if (t < 10.5) {
    // hero slot machine
    const idx = Math.min(NSWAPS-1, Math.floor((t-SWAP_T0)/SWAP_MS));
    if (idx !== lastIdx && idx >= 0) { lastIdx = idx; sparkle(W/2, 250, [PINK,TEAL,AMBER,PURP][idx%4], 10); }
    spotlight(W/2, 420, 150, 'rgb(123,104,238)', 0.35);
    if (idx >= 0) {
      const k = Math.min(1, ((t-SWAP_T0)%SWAP_MS)/0.1);
      avatar(AV[idx], W/2, 420, 4.6 + 0.3*(1-k));
    } else avatar(AV[0], W/2, 420, 4.6);
    neon('hats · hair · fits · masks · eyes', W/2, 480, 24, TEAL, 8);
  } else if (t < 16) {
    neon('the wardrobe, by the numbers', W/2, 90, 28, AMBER, 10);
    const rows = [
      [11.0, '18 hairstyles · 28 tops · 17 bottoms'],
      [12.0, '26 hats · 31 accessories · 26 eye styles'],
    ];
    rows.forEach(([at, txt], i) => { if (t > at) neon(type(txt, at, t, 30), W/2, 170 + i*55, 26, CREAM, 8); });
    if (t > 13.2) {
      const k = Math.min(1, (t-13.2)/0.25);
      ctx.save(); ctx.translate(W/2, 330); ctx.scale(1+0.5*(1-k), 1+0.5*(1-k));
      neon('≈ 718,000,000 combinations', 0, 0, 42, PINK, 18);
      ctx.restore();
    }
    if (t > 14.4) neon('before you pick a single color', W/2, 395, 24, TEAL, 8);
  } else if (t < 22.5) {
    // lineup
    neon('no two citizens alike', W/2, 90, 32, CREAM, 12);
    LINEUP.forEach((ai, i) => {
      const at = 16.4 + i*0.4;
      if (t < at) return;
      if (i > lastPop) { lastPop = i; sparkle(130 + i*118, 300, [PINK,TEAL,AMBER,PURP][i%4], 8); }
      const k = Math.min(1, (t-at)/0.2);
      spotlight(130 + i*118, 400, 62, 'rgb(93,202,165)', 0.22);
      avatar(AV[ai], 130 + i*118, 400 - 12*(1-k), 2.6, k);
    });
    if (t > 20) neon('walk the same street — never the same look', W/2, 480, 22, TEAL, 8);
  } else if (t < 26.5) {
    // color sweep
    const idx = Math.floor((t-22.7)/0.42) % SW.length;
    if (idx !== lastSw && t > 22.7) { lastSw = idx; }
    spotlight(W/2, 420, 150, 'rgb(240,176,64)', 0.3);
    if (t > 22.7) avatar(SW[idx], W/2, 420, 4.6);
    neon('any piece · any color', W/2, 480, 26, AMBER, 10);
  } else {
    const a = Math.min(1, (t-26.5)/0.7);
    ctx.globalAlpha = a;
    neon('make yourself', W/2, 205, 46, PINK, 18);
    neon('thedistrict.online', W/2, 275, 44, TEAL, 18);
    ctx.font = 'bold 20px "Courier New", monospace'; ctx.fillStyle = CREAM; ctx.textAlign = 'center';
    ctx.fillText('rendered by the game — these are real outfits', W/2, 330);
    ctx.globalAlpha = 1;
  }

  // scanlines + vignette
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if (t > 28.9) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1,(t-28.9)/1.0)})`; ctx.fillRect(0,0,W,H); }
}

window.__run = (durS) => new Promise((resolve) => {
  const start = () => {
    const t0 = performance.now();
    const stream = cv.captureStream(60);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12_000_000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const buf = await blob.arrayBuffer();
      let s = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      resolve(btoa(s));
    };
    rec.start(500);
    const loop = () => {
      const t = (performance.now() - t0) / 1000;
      if (t >= durS) { rec.stop(); return; }
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  };
  const ready = [...AV, ...SW].every(im => im.complete);
  if (ready) start(); else setTimeout(start, 500);
});
</script>
</body>
</html>
